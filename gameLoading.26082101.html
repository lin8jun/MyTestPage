<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link id="gameFavicon" rel="icon" href="icon_192.webp">
    <title>Vegas Fox</title>
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --content-top: var(--safe-area-top);
            --content-right: 0px;
            --content-bottom: 0px;
            --content-left: 0px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
            height: 100vh; 
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* In landscape, the portrait device top is the Dynamic Island side. */
        body.physical-top-on-right {
            --content-top: 0px;
            --content-right: var(--safe-area-right);
        }

        body.physical-top-on-left {
            --content-top: 0px;
            --content-left: var(--safe-area-left);
        }

        [hidden] {
            display: none !important;
        }

        #gameFrame {
            position: fixed;
            top: var(--content-top);
            right: var(--content-right);
            bottom: var(--content-bottom);
            left: var(--content-left);
            z-index: 1;
            width: calc(100vw - var(--content-left) - var(--content-right));
            height: calc(100vh - var(--content-top) - var(--content-bottom));
            height: calc(100dvh - var(--content-top) - var(--content-bottom));
            border: 0;
            visibility: hidden;
            background: #000000;
        }

        #gameFrame.is-ready {
            visibility: visible;
        }

        .state-layer {
            position: fixed;
            top: var(--content-top);
            right: var(--content-right);
            bottom: var(--content-bottom);
            left: var(--content-left);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .loading-dots {
            position: fixed;
            top: 55.68%;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 30px;
            transform: translate(-50%, -50%);
        }

        .loading-dot {
            width: 10px;
            height: 10px;
            flex: 0 0 10px;
            border-radius: 50%;
            background: #ffa500;
        }

    </style>
</head>
<body>
    <iframe
        id="gameFrame"
        title="Fishing game"
        allow="autoplay *; fullscreen *; screen-wake-lock *; clipboard-read *; clipboard-write *; payment *; gamepad *"
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <main id="loadingState" class="state-layer" aria-label="Loading game">
        <div class="loading-dots" aria-hidden="true">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </main>

    <script>
        (function () {
            "use strict";

            var GAME_LOAD_TIMEOUT_MS = 60000;
            var GAME_URL_TIMEOUT_MS = 30000;
            var LAUNCH_CHANNEL_PREFIX = "vegasfox-fish-game-launch:";
            var LAUNCH_STORAGE_KEY_PREFIX = "vegasfox:fish-game-launch:";
            var LAUNCH_PAYLOAD_VERSION = 1;
            var LAUNCH_POLL_INTERVAL_MS = 250;
            var gameFrame = document.getElementById("gameFrame");
            var loadingState = document.getElementById("loadingState");
            var gameFavicon = document.getElementById("gameFavicon");
            var gameUrl = "";
            var loadTimer = 0;
            var waitingForUrlTimer = 0;
            var loadAttempt = 0;
            var wakeLock = null;
            var launchId = readLaunchId();
            var hallUrl = readHallUrl();
            var gameLoadingPathname = window.location.pathname;
            var launchStorageKey = "";
            var launchPollTimer = 0;
            var launchChannel = null;
            var shouldResumeHall = false;

            function normalizeHttpUrl(value) {
                if (!value) {
                    return "";
                }

                try {
                    var parsedUrl = new URL(value);
                    return parsedUrl.protocol === "https:" || parsedUrl.protocol === "http:" ? parsedUrl.href : "";
                } catch (error) {
                    return "";
                }
            }

            function readLaunchId() {
                var value = new URLSearchParams(window.location.hash.slice(1)).get("launchId") || "";
                return /^[a-zA-Z0-9-]{16,128}$/.test(value) ? value : "";
            }

            function readHallUrl() {
                var value = new URLSearchParams(window.location.hash.slice(1)).get("hallUrl");
                var normalizedUrl = normalizeHttpUrl(value);
                if (!normalizedUrl) {
                    return "";
                }

                try {
                    var parsedUrl = new URL(normalizedUrl);
                    return parsedUrl.origin === window.location.origin ? parsedUrl.href : "";
                } catch (error) {
                    return "";
                }
            }

            function isStandalonePwa() {
                return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
                    || window.navigator.standalone === true;
            }

            function updatePhysicalTopSafeArea() {
                var angle = window.screen && window.screen.orientation
                    && typeof window.screen.orientation.angle === "number"
                    ? window.screen.orientation.angle
                    : window.orientation;
                var isLandscape = window.matchMedia
                    && window.matchMedia("(orientation: landscape)").matches;

                document.body.classList.toggle(
                    "physical-top-on-right",
                    isLandscape && (angle === 270 || angle === -90)
                );
                document.body.classList.toggle(
                    "physical-top-on-left",
                    isLandscape && (angle === 90 || angle === -270)
                );
            }

            function isFreshFishingLaunch(targetUrl) {
                if (!targetUrl) {
                    return false;
                }

                try {
                    var parsedUrl = new URL(targetUrl);
                    var params = new URLSearchParams(parsedUrl.hash.slice(1));
                    return parsedUrl.origin === window.location.origin
                        && parsedUrl.pathname === gameLoadingPathname
                        && Boolean(params.get("launchId"));
                } catch (error) {
                    return false;
                }
            }

            function setupPwaLaunchRecovery() {
                if (!hallUrl || !isStandalonePwa() || !window.launchQueue
                    || typeof window.launchQueue.setConsumer !== "function") {
                    return;
                }

                window.launchQueue.setConsumer(function (launchParams) {
                    var targetUrl = launchParams && launchParams.targetURL;
                    if (!targetUrl || isFreshFishingLaunch(targetUrl)) {
                        return;
                    }
                    window.location.replace(hallUrl);
                });
            }

            function prepareHallResume() {
                if (!hallUrl || !isStandalonePwa()) {
                    return;
                }

                try {
                    window.history.replaceState(window.history.state, document.title, hallUrl);
                    shouldResumeHall = true;
                } catch (error) {}
            }

            function requestWakeLock() {
                if (!document.hidden && "wakeLock" in navigator && !wakeLock) {
                    navigator.wakeLock.request("screen").then(function (lock) {
                        wakeLock = lock;
                        lock.addEventListener("release", function () {
                            wakeLock = null;
                        });
                    }).catch(function () {
                        wakeLock = null;
                    });
                }
            }

            function releaseWakeLock() {
                if (wakeLock) {
                    wakeLock.release().catch(function () {});
                    wakeLock = null;
                }
            }

            function readGameUrl() {
                var value = new URLSearchParams(window.location.hash.slice(1)).get("gameUrl");
                return normalizeHttpUrl(value);
            }

            function applyPageMetadata() {
                var params = new URLSearchParams(window.location.hash.slice(1));
                var title = params.get("gameTitle");
                var icon = params.get("gameIcon");

                document.title = title || "Fishing Game";
                if (!icon) {
                    return;
                }

                try {
                    var iconUrl = new URL(icon, window.location.origin);
                    if (iconUrl.protocol === "https:" || iconUrl.protocol === "http:") {
                        gameFavicon.href = iconUrl.href;
                    }
                } catch (error) {}
            }

            function showLoading() {
                loadingState.hidden = false;
                gameFrame.classList.remove("is-ready");
            }

            function removeStoredLaunchPayload() {
                if (!launchStorageKey) {
                    return;
                }

                try {
                    window.localStorage.removeItem(launchStorageKey);
                } catch (error) {}
            }

            function handleLaunchStorage(event) {
                if (event.key === launchStorageKey && event.newValue) {
                    handleLaunchPayload(event.newValue);
                }
            }

            function stopLaunchBridge(removePayload) {
                window.clearInterval(launchPollTimer);
                launchPollTimer = 0;
                window.removeEventListener("storage", handleLaunchStorage);
                if (launchChannel) {
                    launchChannel.close();
                    launchChannel = null;
                }
                if (removePayload) {
                    removeStoredLaunchPayload();
                }
            }

            function saveGameUrlToLocation(nextGameUrl) {
                var params = new URLSearchParams(window.location.hash.slice(1));
                params.delete("launchId");
                params.set("gameUrl", nextGameUrl);
                window.history.replaceState(window.history.state, document.title, "#" + params.toString());
            }

            function handleLaunchPayload(payload) {
                if (typeof payload === "string") {
                    try {
                        payload = JSON.parse(payload);
                    } catch (error) {
                        removeStoredLaunchPayload();
                        return false;
                    }
                }

                if (!payload || payload.version !== LAUNCH_PAYLOAD_VERSION || payload.launchId !== launchId) {
                    return false;
                }

                if (typeof payload.expiresAt !== "number" || payload.expiresAt <= Date.now()) {
                    removeStoredLaunchPayload();
                    return false;
                }

                if (payload.action === "close") {
                    closeOnLoadFailure();
                    return true;
                }

                if (payload.action !== "load") {
                    return false;
                }

                var nextGameUrl = normalizeHttpUrl(payload.gameUrl);
                if (!nextGameUrl) {
                    return false;
                }

                window.clearTimeout(waitingForUrlTimer);
                stopLaunchBridge(true);
                saveGameUrlToLocation(nextGameUrl);
                gameUrl = nextGameUrl;
                loadGame();
                return true;
            }

            function readStoredLaunchPayload() {
                if (!launchStorageKey) {
                    return false;
                }

                try {
                    var payload = window.localStorage.getItem(launchStorageKey);
                    return payload ? handleLaunchPayload(payload) : false;
                } catch (error) {
                    return false;
                }
            }

            function startLaunchBridge() {
                launchStorageKey = LAUNCH_STORAGE_KEY_PREFIX + launchId;
                window.addEventListener("storage", handleLaunchStorage);

                if (typeof BroadcastChannel !== "undefined") {
                    try {
                        launchChannel = new BroadcastChannel(LAUNCH_CHANNEL_PREFIX + launchId);
                        launchChannel.onmessage = function (event) {
                            handleLaunchPayload(event.data);
                        };
                    } catch (error) {
                        launchChannel = null;
                    }
                }

                if (!readStoredLaunchPayload()) {
                    launchPollTimer = window.setInterval(readStoredLaunchPayload, LAUNCH_POLL_INTERVAL_MS);
                }
            }

            function closeOnLoadFailure() {
                window.clearTimeout(loadTimer);
                window.clearTimeout(waitingForUrlTimer);
                stopLaunchBridge(true);
                loadAttempt++;
                gameFrame.onload = null;
                gameFrame.onerror = null;
                gameFrame.removeAttribute("src");
                gameFrame.classList.remove("is-ready");
                window.close();
            }

            function showGame() {
                window.clearTimeout(loadTimer);
                loadingState.hidden = true;
                gameFrame.classList.add("is-ready");
                gameFrame.focus();
            }

            function loadGame() {
                if (!gameUrl) {
                    closeOnLoadFailure();
                    return;
                }

                requestWakeLock();
                showLoading();
                var currentAttempt = ++loadAttempt;
                window.clearTimeout(loadTimer);

                gameFrame.onload = function () {
                    if (currentAttempt === loadAttempt) {
                        showGame();
                    }
                };
                gameFrame.onerror = function () {
                    if (currentAttempt === loadAttempt) {
                        closeOnLoadFailure();
                    }
                };
                gameFrame.src = gameUrl;

                loadTimer = window.setTimeout(function () {
                    if (currentAttempt === loadAttempt) {
                        closeOnLoadFailure();
                    }
                }, GAME_LOAD_TIMEOUT_MS);
            }

            function startFromLocation() {
                var nextGameUrl = readGameUrl();
                if (!nextGameUrl || nextGameUrl === gameUrl) {
                    return;
                }

                window.clearTimeout(waitingForUrlTimer);
                gameUrl = nextGameUrl;
                loadGame();
            }

            function isReloadNavigation() {
                var navigationEntries = performance.getEntriesByType ? performance.getEntriesByType("navigation") : [];
                if (navigationEntries.length > 0) {
                    return navigationEntries[0].type === "reload";
                }

                return performance.navigation && performance.navigation.type === 1;
            }

            function handleGameMessage(event) {
                if (event.source !== gameFrame.contentWindow || !event.data) {
                    return;
                }

                if (event.data.action === "onGameReady") {
                    showGame();
                }

                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage(event.data, window.location.origin);
                }

                if (event.data.action === "closeGame" || event.data.action === "gotoPage") {
                    window.close();
                }
            }

            window.addEventListener("message", handleGameMessage);
            window.addEventListener("orientationchange", updatePhysicalTopSafeArea);
            window.addEventListener("hashchange", function () {
                applyPageMetadata();
                startFromLocation();
            });
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) {
                    releaseWakeLock();
                } else {
                    if (shouldResumeHall && hallUrl) {
                        window.location.replace(hallUrl);
                        return;
                    }
                    requestWakeLock();
                }
            });
            window.addEventListener("pagehide", function () {
                releaseWakeLock();
                stopLaunchBridge(false);
                prepareHallResume();
            });
            window.addEventListener("pageshow", function () {
                if (shouldResumeHall && hallUrl) {
                    window.location.replace(hallUrl);
                }
            });

            requestWakeLock();
            updatePhysicalTopSafeArea();
            applyPageMetadata();
            setupPwaLaunchRecovery();
            if (isReloadNavigation()) {
                var reloadedGameUrl = readGameUrl();
                if (reloadedGameUrl) {
                    window.location.replace(reloadedGameUrl);
                } else {
                    closeOnLoadFailure();
                }
            } else {
                startFromLocation();
                if (!gameUrl && launchId) {
                    startLaunchBridge();
                }
                if (!gameUrl) {
                    waitingForUrlTimer = window.setTimeout(closeOnLoadFailure, GAME_URL_TIMEOUT_MS);
                }
            }
        }());
    </script>
</body>
</html>
